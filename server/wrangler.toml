# Ora's server on Cloudflare Workers: public pages, the JSON API, the admin panel (/admin)
# and the phone app (/app/). Data lives in D1 (SQLite). Deployed automatically from GitHub.
name = "ora"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# the Worker answers /, /privacy, /admin and /api itself; files in public/ are served directly
run_worker_first = ["/", "/privacy", "/admin", "/admin/*", "/api/*", "/healthz", "/app"]

[[d1_databases]]
binding = "DB"
database_name = "ora-db"
database_id = "9ae8eb08-c2ee-40cf-ac16-62af47622ba0"

[observability]
enabled = true

# Secrets (set in the Cloudflare dashboard: Worker → Settings → Variables and Secrets):
#   ADMIN_PASSWORD   the admin panel password (at least 10 characters)
